<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=VT323&display=swap">
<style>
  * { margin:0; box-sizing:border-box; }
  body { width:1600px; height:900px; overflow:hidden; font-family:Inter,sans-serif; }
  #card { position:relative; width:1600px; height:900px; overflow:hidden;
    background: radial-gradient(1100px 700px at 50% 45%, #2a1250 0%, #160829 60%, #0c0418 100%); }
  #card::before { content:''; position:absolute; inset:0; opacity:.35;
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 2px, transparent 2px 5px), repeating-linear-gradient(-45deg, rgba(0,0,0,.25) 0 2px, transparent 2px 6px); }
  .pin { position:absolute; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .disc { width:150px; height:150px; border-radius:50%; display:grid; place-items:center; position:relative;
    background: radial-gradient(circle at 35% 30%, #fff8c9 0%, #f4c542 30%, #b8860b 70%, #7a5600 100%);
    box-shadow: 0 18px 30px rgba(0,0,0,.55), 0 4px 6px rgba(0,0,0,.4), inset 0 -4px 8px rgba(0,0,0,.35); }
  .disc::before { content:''; position:absolute; inset:11px; border-radius:50%;
    background: radial-gradient(circle at 35% 28%, color-mix(in srgb, var(--c) 55%, #fff) 0%, var(--c) 45%, color-mix(in srgb, var(--c) 55%, #000) 100%);
    box-shadow: inset 0 3px 6px rgba(255,255,255,.45), inset 0 -6px 10px rgba(0,0,0,.35); }
  .disc::after { content:''; position:absolute; left:26px; top:18px; width:60px; height:28px; border-radius:50%; background:rgba(255,255,255,.35); filter:blur(4px); transform:rotate(-25deg); }
  .i { position:relative; width:78px; height:78px; shape-rendering:crispEdges; filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)); }
  .lbl { font:700 21px Inter; color:#f3e9ff; background:rgba(0,0,0,.35); padding:5px 14px; border-radius:999px; letter-spacing:.01em; }
  .center { position:absolute; left:0; right:0; top:345px; text-align:center; }
  .h { font:800 68px/1.05 Inter; letter-spacing:-.04em; color:#fff; text-shadow:0 6px 30px rgba(0,0,0,.6); }
  .h span { color:#ffd319; }
  .s { margin-top:14px; font:34px VT323; color:#cbb8ef; letter-spacing:.04em; }
  .foot { position:absolute; left:0; right:0; bottom:44px; text-align:center; font:700 26px Inter; color:#fff; }
  .foot span { color:#9c8bc0; font-weight:600; margin-left:14px; }
</style></head><body>
