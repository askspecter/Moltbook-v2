  body { width: 1920px; height: 1080px; overflow: hidden; font-family: Inter, sans-serif; }

  .sk { box-shadow: inset 2px 2px #0a0a0a, inset -2px -2px #fff; }
  .tb { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 16px; font: 700 21px Inter; color: #111; }
  .tb img { width: 26px; height: 26px; border-radius: 6px; }
  .tray { margin-left: auto; height: 44px; padding: 0 18px; display: flex; align-items: center; font: 600 20px Inter; color: #111; }
  .win { background: #c3c7cb; padding: 5px; color: #111; box-shadow: inset -2px -2px #0a0a0a, inset 2px 2px #fff, inset -4px -4px #4a4a4a, 14px 14px 0 rgba(0,0,0,.4); }

  .bar.blue { background: linear-gradient(90deg, #000080, #1084d0); }

  .type { font: 84px/1 VT323; color: #05ffa1; text-shadow: 0 0 18px rgba(5,255,161,.5); }

  .chrome { font: 400 150px/0.95 'Rubik Mono One'; letter-spacing: -.03em; word-spacing: -.3em; text-align: center;
    background: linear-gradient(180deg, #fff 0%, #a8ffe0 38%, #0f6e55 50%, #c9fff0 56%, #fff 85%); -webkit-background-clip: text; color: transparent;
    -webkit-text-stroke: 3px #061a3a; filter: drop-shadow(6px 6px 0 #ff2975) drop-shadow(6px 6px 0 #01cdfe); }
  .sub { font: 46px VT323; color: #bfe9ff; text-align: center; margin-top: 26px; letter-spacing: .03em; }
  .body { padding: 26px 30px 30px; }
  .top { display: flex; gap: 34px; align-items: center; margin-bottom: 26px; }
  .score { background: #0e2a5c; color: #05ffa1; width: 300px; padding: 14px 0 10px; text-align: center; font-family: VT323; box-shadow: inset 3px 3px #0a0a0a, inset -3px -3px #fff; }
  .score b { display: block; font: 150px/0.9 VT323; text-shadow: 0 0 24px rgba(5,255,161,.55); }
  .score small { font-size: 34px; color: #bfe9ff; }
  .tier { font: 400 70px/1 'Rubik Mono One'; color: #000080; }
  .who { font: 700 30px Inter; margin-top: 12px; } .who .ck { color: #000080; } .who span.m { color: #666; font-weight: 600; }
  .rows { display: grid; gap: 14px; }
  .row { display: grid; grid-template-columns: 290px 1fr 150px; gap: 22px; align-items: center; font: 600 29px Inter; }
  .row .n { text-align: right; font: 40px/1 VT323; color: #000080; }
  .barx { height: 32px; padding: 4px; background: #fff; box-shadow: inset 2px 2px #0a0a0a, inset -2px -2px #fff; }
  .barx i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, #0f9e6e 0 14px, transparent 14px 18px); }
  .tok { width: 1500px; font: 40px/1.25 VT323; color: #bfe9ff; word-break: break-all; }
  .tok .h { color: #ff71ce; } .tok .p { color: #05ffa1; } .tok .s { color: #01cdfe; }
  .stamp { font: 400 92px/1 'Rubik Mono One'; padding: 18px 40px; border: 10px solid; border-radius: 14px; transform-origin: center; }
  .stamp.ok { color: #05ffa1; border-color: #05ffa1; text-shadow: 0 0 20px rgba(5,255,161,.6); box-shadow: 0 0 40px rgba(5,255,161,.35); }
  .stamp.bad { color: #ff2975; border-color: #ff2975; text-shadow: 0 0 20px rgba(255,41,117,.6); box-shadow: 0 0 40px rgba(255,41,117,.35); }
  .cap { font: 800 84px/1.04 Inter; letter-spacing: -.04em; color: #fff; text-shadow: 4px 4px 0 rgba(0,0,0,.45); text-align: center; }
  .cap .m { color: #05ffa1; } .cap .p { color: #ff71ce; }
  .claim { font: 44px VT323; color: #fff; text-align: center; }

  .ladder { display: flex; align-items: flex-end; gap: 26px; }
  .rung { width: 280px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .rung .lb { font: 400 30px 'Rubik Mono One'; color: #fff; } .rung .mn { font: 36px VT323; color: #bfe9ff; }

  .flash { position: absolute; inset: 0; background: #fff; pointer-events: none; z-index: 8; opacity: 0; }

<script>
const W = 1920, H = 1080, L = document.getElementById('L');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = (x) => 1 - Math.pow(1 - clamp(x), 3);
const eio = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = (x) => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const ico = (n) => `<svg class="ico"><use href="#${n}"/></svg>`;
function el(html, x, y, w) { const d = document.createElement('div'); d.className = 'el'; d.style.left = x + 'px'; d.style.top = y + 'px'; if (w) d.style.width = w + 'px'; d.innerHTML = html; L.appendChild(d); return d; }
function vis(e, t, a, b, { dur = .4, out = .3, dy = 30, sc = 0 } = {}) {
  const i = eo((t - a) / dur), o = 1 - eio((t - (b - out)) / out), v = Math.min(i, o);
  e.style.opacity = v; e.style.visibility = v > .001 ? 'visible' : 'hidden';
  e.style.transform = `translateY(${(1 - i) * dy}px) scale(${1 + (1 - i) * sc})`;
  return v;
}

window.render = function (t) {
  document.getElementById('flash').style.opacity = Math.max(0, ...flashAt.map((f) => .75 - Math.abs(t - f) * 5));
  // terminal 0–2.9

  const n = Math.floor(clamp((t - .4) / 1.6) * TYPE.length);

  const tierEl = document.getElementById('tier'), tn = TIERS.find(([m]) => sum >= m)[1];

  // token 13–19

  const seg = (s, a, cls) => `<span class="${cls}">${s.slice(0, Math.max(0, m - a))}</span>`;
  let pay = TOKEN_P; if (t > 16.35) pay = pay.slice(0, 30) + 'Ojk5OS' + pay.slice(36);
  tok.firstChild.innerHTML = seg(TOKEN_H, 0, 'h') + (m > TOKEN_H.length ? '.' : '') + seg(pay, TOKEN_H.length + 1, 'p') + (m > TOKEN_H.length + TOKEN_P.length + 1 ? '.' : '') + seg(TOKEN_S, TOKEN_H.length + TOKEN_P.length + 2, 's');
  vis(claimOk, t, 14.6, 16.35, { dur: .3, out: .05, dy: 16 });

  vis(bad, t, 16.45, 19.2, { dur: .25, dy: 0, sc: 1.2 }); bad.firstChild.style.transform = `rotate(5deg) translateX(${t > 16.45 && t < 16.8 ? Math.sin(t * 90) * 10 : 0}px)`;
  vis(cap1, t, 16.9, 19.2);
  // ladder 19.3–23.4
  vis(ladder, t, 19.3, 23.4, { dur: .4 });
  for (let i = 0; i < 5; i++) document.getElementById('pl' + i).style.height = Math.max(0, back((t - 19.8 - i * .22) / .6)) * (90 + i * 75) + 'px';
  // end 23.5–28
  vis(endEl, t, 23.5, 28.5, { dur: .5, sc: .08 });
  document.getElementById('task').textContent = t < 5.4 ? 'Kelpbook.exe' : t < 13 ? 'KelpRecord.exe' : t < 19.3 ? 'Attestation' : t < 23.5 ? 'Tiers' : 'Kelpbook.exe';
};
