<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Inter:wght@500;700&display=swap">
<style>
  body { margin: 0; padding: 36px; font-family: Inter, sans-serif; color: #fff;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.12) 0 1px, transparent 1px 56px), repeating-linear-gradient(0deg, rgba(255,255,255,.12) 0 1px, transparent 1px 56px), linear-gradient(180deg, #2b1055, #5b3a9c 45%, #7597de 75%, #ff71ce); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
  .card { background: rgba(20,6,45,.55); border: 1px solid rgba(255,255,255,.18); border-radius: 22px; padding: 24px; text-align: center; }
  h2 { margin: 0 0 16px; font-size: 20px; }
  .big { width: 240px; filter: drop-shadow(0 18px 30px rgba(20,0,50,.5)); }
  .word { margin: 16px 0 14px; font: 400 32px/1 'Rubik Mono One';
    background: linear-gradient(180deg, #fff 0%, #a8e6ff 38%, #2a3a8a 50%, #ffd6f5 56%, #fff 85%); -webkit-background-clip: text; color: transparent;
    -webkit-text-stroke: 1.5px #1a0b3a; filter: drop-shadow(2px 2px 0 #ff2975) drop-shadow(2px 2px 0 #01cdfe); }
  .tiny { display: flex; gap: 12px; justify-content: center; align-items: end; }
  .win { background: #c3c7cb; padding: 6px 10px; display: flex; gap: 8px; align-items: center; color: #111; font-weight: 700; font-size: 13px; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff; }
</style></head><body><div class="grid">
<div class="card"><h2>A · Neon glow</h2><img class="big" src="kelpbot-a.svg"><div class="word">KELPBOOK</div>
<div class="tiny"><img src="kelpbot-a.svg" width="64"><img src="kelpbot-a.svg" width="32"><img src="kelpbot-a.svg" width="16"><span class="win"><img src="kelpbot-a.svg" width="18">Start</span></div></div>
<div class="card"><h2>B · Clean</h2><img class="big" src="kelpbot-b.svg"><div class="word">KELPBOOK</div>
<div class="tiny"><img src="kelpbot-b.svg" width="64"><img src="kelpbot-b.svg" width="32"><img src="kelpbot-b.svg" width="16"><span class="win"><img src="kelpbot-b.svg" width="18">Start</span></div></div>
</div></body></html>
